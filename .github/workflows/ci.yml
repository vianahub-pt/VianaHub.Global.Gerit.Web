name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npx tsc --project tsconfig.typecheck.json --noEmit

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

  e2e-validation:
    name: E2E Validation
    runs-on: ubuntu-24.04
    concurrency:
      group: gerit-shared-e2e
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test capability selection and E2E outcomes
        run: |
          node scripts/e2e/preflight.mjs --self-test
          node scripts/e2e/select-capabilities.mjs --self-test
          node scripts/e2e/run-capability.mjs --self-test

      - name: Select affected E2E journeys
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          EVENT_PATH: ${{ github.event_path }}
          REPOSITORY_NAME: ${{ github.repository }}
          SCOPE_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'e2e-scope-approved') }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            plan=$(node scripts/e2e/select-capabilities.mjs --full-regression)
          else
            git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-files.txt"
            plan=$(node scripts/e2e/select-capabilities.mjs --compare "$BASE_SHA" "$HEAD_SHA" --scope-title "$PR_TITLE" --scope-approved "$SCOPE_APPROVED" --event-name "$EVENT_NAME" --event-path "$EVENT_PATH" --repository-name "$REPOSITORY_NAME" < "$RUNNER_TEMP/changed-files.txt")
          fi
          capabilities=$(node -e 'process.stdout.write(JSON.stringify(JSON.parse(process.argv[1]).capabilities))' "$plan")
          scope_json=$(node -e 'process.stdout.write(JSON.stringify(JSON.parse(process.argv[1]).scope))' "$plan")
          scope=$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).scope.join(","))' "$plan")
          scope_approved=$(node -e 'process.stdout.write(String(JSON.parse(process.argv[1]).scopeApproved))' "$plan")
          run_e2e=$(node -e 'process.stdout.write(String(JSON.parse(process.argv[1]).runE2E))' "$plan")
          functional_capabilities=$(node -e 'process.stdout.write(JSON.stringify(JSON.parse(process.argv[1]).functionalCapabilities ?? JSON.parse(process.argv[1]).capabilities))' "$plan")
          shared_components=$(node -e 'process.stdout.write(JSON.stringify(JSON.parse(process.argv[1]).sharedComponents))' "$plan")
          presentation_consumers=$(node -e 'process.stdout.write(JSON.stringify(JSON.parse(process.argv[1]).presentationConsumers ?? []))' "$plan")
          presentation_consumers_csv=$(node -e 'process.stdout.write((JSON.parse(process.argv[1]).presentationConsumers ?? []).join(","))' "$plan")
          shared_regression_required=$(node -e 'process.stdout.write(String(JSON.parse(process.argv[1]).sharedUiRegressionRequired === true))' "$plan")
          structural_sync_verified=$(node -e 'process.stdout.write(String(JSON.parse(process.argv[1]).structuralSyncVerified === true))' "$plan")
          reason=$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).reason)' "$plan")
          echo "Declared E2E scope: $scope (approved=$scope_approved)"
          echo "Selected E2E capabilities: $capabilities"
          echo "Selection reason: $reason"
          echo "capabilities=$capabilities" >> "$GITHUB_OUTPUT"
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "scope_json=$scope_json" >> "$GITHUB_OUTPUT"
          echo "scope_approved=$scope_approved" >> "$GITHUB_OUTPUT"
          echo "run_e2e=$run_e2e" >> "$GITHUB_OUTPUT"
          echo "functional_capabilities=$functional_capabilities" >> "$GITHUB_OUTPUT"
          echo "shared_components=$shared_components" >> "$GITHUB_OUTPUT"
          echo "presentation_consumers=$presentation_consumers" >> "$GITHUB_OUTPUT"
          echo "presentation_consumers_csv=$presentation_consumers_csv" >> "$GITHUB_OUTPUT"
          echo "shared_regression_required=$shared_regression_required" >> "$GITHUB_OUTPUT"
          echo "structural_sync_verified=$structural_sync_verified" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

      - name: Verify E2E configuration
        if: ${{ steps.select.outputs.run_e2e == 'true' }}
        env:
          GERIT_API_BASE_URL: ${{ vars.GERIT_API_BASE_URL }}
          E2E_USER_EMAIL: ${{ vars.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: |
          if [ -z "$GERIT_API_BASE_URL" ] || [ -z "$E2E_USER_EMAIL" ] || [ -z "$E2E_USER_PASSWORD" ]; then
            echo "GERIT_API_BASE_URL, E2E_USER_EMAIL, and E2E_USER_PASSWORD are required for selected E2E journeys."
            exit 1
          fi

      - name: Run required static and focused regression tests
        id: run-regression-tests
        if: ${{ steps.select.outputs.run_e2e == 'true' }}
        run: npm test

      - name: Install Playwright Chromium
        if: ${{ steps.select.outputs.run_e2e == 'true' }}
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npx playwright install --with-deps chromium; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done
          echo "Playwright Chromium installation failed after 3 attempts."
          exit 1

      - name: Prepare isolated E2E build
        if: ${{ steps.select.outputs.run_e2e == 'true' }}
        run: npm run e2e:prepare
        env:
          GERIT_API_BASE_URL: ${{ vars.GERIT_API_BASE_URL }}

      - name: Run selected E2E journeys
        id: run-selected
        if: ${{ steps.select.outputs.run_e2e == 'true' }}
        shell: bash
        env:
          CI: true
          E2E_USER_EMAIL: ${{ vars.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          GERIT_API_BASE_URL: ${{ vars.GERIT_API_BASE_URL }}
          SELECTED_CAPABILITIES: ${{ steps.select.outputs.capabilities }}
          SELECTED_SCOPE: ${{ steps.select.outputs.scope }}
          SHARED_REGRESSION_REQUIRED: ${{ steps.select.outputs.shared_regression_required }}
          SHARED_COMPONENTS: ${{ steps.select.outputs.shared_components }}
          SCOPE_APPROVED: ${{ steps.select.outputs.scope_approved }}
        run: |
          mapfile -t capabilities < <(node -e 'for (const item of JSON.parse(process.env.SELECTED_CAPABILITIES)) console.log(item)')
          if [ "${#capabilities[@]}" -eq 0 ]; then
            echo "E2E selection requested execution but returned no capabilities."
            exit 1
          fi
          printf 'Running functional capabilities in one Playwright process: %s\n' "${capabilities[*]}"
          if [ "$SHARED_REGRESSION_REQUIRED" = "true" ]; then
            if [ "${capabilities[*]}" = "actions" ] && [ "$SHARED_COMPONENTS" = '["hub-switch"]' ]; then
              echo "HubSwitch regression is covered by tests/shared/ui-standard.test.mjs in npm test."
            elif [ "${capabilities[*]}" != "clients" ]; then
              echo "Shared UI regression requires the selected mocked Client integration suite; unexpected capability plan."
              exit 1
            fi
          fi
          scope_args=(--scope "$SELECTED_SCOPE")
          if [ "$SCOPE_APPROVED" = "true" ]; then scope_args+=(--scope-approved); fi
          npm run test:e2e:capability -- "${scope_args[@]}" "${capabilities[@]}"

      - name: Upload Playwright report and traces
        if: ${{ always() && steps.select.outputs.run_e2e == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: selected-e2e-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

      - name: Validate E2E Validation result
        if: ${{ always() }}
        env:
          SELECTION_STATUS: ${{ steps.select.outcome }}
          SELECTED_CAPABILITIES: ${{ steps.select.outputs.capabilities }}
          SELECTED_SCOPE_JSON: ${{ steps.select.outputs.scope_json }}
          SCOPE_APPROVED: ${{ steps.select.outputs.scope_approved }}
          RUN_E2E: ${{ steps.select.outputs.run_e2e }}
          STRUCTURAL_SYNC_VERIFIED: ${{ steps.select.outputs.structural_sync_verified }}
          SELECTION_REASON: ${{ steps.select.outputs.reason }}
          E2E_STATUS: ${{ steps.run-selected.outcome }}
          FUNCTIONAL_CAPABILITIES: ${{ steps.select.outputs.functional_capabilities }}
          SHARED_COMPONENTS: ${{ steps.select.outputs.shared_components }}
          PRESENTATION_CONSUMERS: ${{ steps.select.outputs.presentation_consumers }}
          SHARED_REGRESSION_REQUIRED: ${{ steps.select.outputs.shared_regression_required }}
          SHARED_REGRESSION_STATUS: ${{ steps.run-selected.outcome }}
          SHARED_REGRESSION_CONSUMERS: ${{ steps.select.outputs.presentation_consumers }}
          REGRESSION_TESTS_STATUS: ${{ steps.run-regression-tests.outcome }}
        run: |
          node scripts/e2e/select-capabilities.mjs --validate-outcome <<EOF
          {"selectionStatus":"$SELECTION_STATUS","capabilities":$SELECTED_CAPABILITIES,"functionalCapabilities":$FUNCTIONAL_CAPABILITIES,"scope":$SELECTED_SCOPE_JSON,"scopeApproved":$SCOPE_APPROVED,"runE2E":$RUN_E2E,"reason":"$SELECTION_REASON","structuralSyncVerified":$STRUCTURAL_SYNC_VERIFIED,"e2eStatus":"$E2E_STATUS","sharedUiRegressionRequired":$SHARED_REGRESSION_REQUIRED,"sharedComponents":$SHARED_COMPONENTS,"presentationConsumers":$PRESENTATION_CONSUMERS,"sharedRegressionConsumers":$SHARED_REGRESSION_CONSUMERS,"sharedRegressionStatus":"$SHARED_REGRESSION_STATUS","regressionTestsStatus":"$REGRESSION_TESTS_STATUS"}
          EOF
