name: CI

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npx tsc --project tsconfig.typecheck.json --noEmit

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

  e2e:
    name: Actions E2E
    runs-on: ubuntu-latest
    if: ${{ vars.GERIT_API_BASE_URL != '' && vars.E2E_USER_EMAIL != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify E2E credentials are configured
        env:
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: |
          if [ -z "$E2E_USER_PASSWORD" ]; then
            echo "E2E_USER_PASSWORD secret is required when GERIT_API_BASE_URL and E2E_USER_EMAIL are configured."
            exit 1
          fi

      - name: Prepare isolated E2E build
        run: npm run e2e:prepare
        env:
          GERIT_API_BASE_URL: ${{ vars.GERIT_API_BASE_URL }}

      - name: Run Actions E2E
        run: npm run test:e2e:actions-ci
        env:
          CI: true
          E2E_USER_EMAIL: ${{ vars.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          GERIT_API_BASE_URL: ${{ vars.GERIT_API_BASE_URL }}

      - name: Upload Playwright report and traces
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: actions-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
